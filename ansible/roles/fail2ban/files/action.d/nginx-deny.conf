# Managed by Ansible (platform/roles/fail2ban)
#
# Ban inside nginx instead of the firewall. Sites behind Cloudflare
# connect from Cloudflare IPs, so an iptables/nftables ban on the real
# client IP never matches. nginx's realip module (cloudflare-realip.conf)
# has already replaced $remote_addr with CF-Connecting-IP by the access
# phase, so an http-level `deny <ip>;` hits the real client.
#
# One file per jail (/etc/nginx/f2b/<jail>.conf) so stopping one jail
# only flushes its own bans. /etc/nginx/conf.d/fail2ban.conf includes
# /etc/nginx/f2b/*.conf inside http {}.
#
# Every change runs `nginx -t` before reloading; if the test fails the
# reload is skipped and the action fails, so fail2ban logs an error
# instead of nginx going down.
#
# NOTE: don't name an [Init] option after a fail2ban action method
# (e.g. `reload`, `start`, `stop`, `ban`): the server treats such values as
# JSON call arguments and fails to start (JSONDecodeError).

[Definition]

actionstart = mkdir -p <banfile_dir>
              touch <banfile>
              chmod 0644 <banfile>

actionflush = : > <banfile>
              <nginx_reload>

actionstop = %(actionflush)s

actioncheck =

actionban = grep -qxF 'deny <ip>;' <banfile> || echo 'deny <ip>;' >> <banfile>
            <nginx_reload>

actionunban = tmp=$(mktemp) && grep -vxF 'deny <ip>;' <banfile> > "$tmp"; cat "$tmp" > <banfile>; rm -f "$tmp"
              <nginx_reload>

[Init]

banfile_dir = /etc/nginx/f2b
banfile = <banfile_dir>/<name>.conf
nginx_reload = nginx -t -q && systemctl reload nginx
