# Managed by Ansible (platform/roles/fail2ban)
#
# Requests for paths that never exist legitimately on our sites:
# secrets/dotfiles, VCS metadata, phpinfo, root-level wp-login/xmlrpc
# (Bedrock serves WordPress from /wp/, so /wp-login.php at the root is
# always a scanner), and the wp REST batch endpoint (abused by
# wp2shell-style exploits).
#
# Matches regardless of status code: a 403 from an nginx deny rule is
# still a probe.
#
# Log format expected: platform "main" format, starting with
#   $remote_addr - $remote_user [$time_local] "$request" ...
# $remote_addr is the real client IP via cloudflare-realip.conf.

[Definition]

_req = ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Z]+ (?:https?://[^/" ]+)?

failregex = %(_req)s/(?:[^" ?]*/)?(?:\.env[^" /?]*|\.git/|\.gitmodules|\.svn/|\.hg/|\.aws/|\.ssh/|\.kube/|\.docker/|\.dockercfg|\.DS_Store|\.htpasswd|(?:php)?info\.php|wp-config\.php[^" /?]+)
            %(_req)s/(?:wp-login|xmlrpc)\.php
            %(_req)s/(?:wp/)?wp-json/batch/v1
            %(_req)s/[^" ]*[?&]rest_route=(?:/|%%2F)batch(?:/|%%2F)v1

ignoreregex =
