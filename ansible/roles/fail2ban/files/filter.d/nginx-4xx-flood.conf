# Managed by Ansible (platform/roles/fail2ban)
#
# Counts every 400/401/403/404/405/444 response per client IP. On its own a
# 404 means nothing; the jail's maxretry/findtime (e.g. 60 per minute) is
# what separates a scanner or scraper from a person with a broken link.
#
# Uptime monitors are ignored so a broken monitor URL can never get the
# monitor itself banned.

[Definition]

failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[^"]*" (?:400|401|403|404|405|444)

ignoreregex = "Better Stack Better Uptime Bot
