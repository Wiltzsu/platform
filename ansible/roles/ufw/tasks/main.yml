---
- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow OpenSSH
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: platform_ufw_ssh_from_ip | default('') | length == 0

- name: Allow SSH from specific IP
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ platform_ufw_ssh_from_ip }}"
  when: platform_ufw_ssh_from_ip | default('') | length > 0

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  when: platform_ufw_allow_web | default(false)

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
  when: platform_ufw_allow_web | default(false)

- name: Enable UFW
  community.general.ufw:
    state: enabled
