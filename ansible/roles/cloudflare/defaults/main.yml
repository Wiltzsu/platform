---
# Write /etc/nginx/conf.d/cloudflare-realip.conf. Off by default: the host
# needs nginx installed, and must not already set real_ip_header elsewhere
# (e.g. by hand in nginx.conf), or `nginx -t` fails on the duplicate.
# Turn on per group in inventory/group_vars.
platform_cloudflare_realip_enabled: false

# Cloudflare edge ranges. Kept here as the single source for nginx real IP
# and, later, a UFW allowlist that only lets Cloudflare reach ports 80/443.
# Source: https://www.cloudflare.com/ips/  (last checked 2026-11-25)
platform_cloudflare_ipv4:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22

platform_cloudflare_ipv6:
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
