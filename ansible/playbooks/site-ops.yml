---
# Install / refresh linux-server-utils clone, cron, and local config templates.
#
#   ansible-playbook -i inventory/hosts.yml playbooks/site-ops.yml --limit apps

- name: Ops tooling from linux-server-utils
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Require Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
        fail_msg: "This playbook targets Ubuntu/Debian only."

  roles:
    - role: linux_server_utils
      tags:
        - utils
