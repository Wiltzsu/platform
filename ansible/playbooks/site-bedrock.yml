---
# DRAFT — Provision nginx + PHP + MySQL DB + directory layout for a Bedrock WordPress site.
#
# Prerequisites:
#   - bootstrap-server.yml already applied (hardening verified)
#   - site_bedrock.yml copied from site_bedrock.example.yml and customized
#   - DNS pointing at server before running certbot (manual step below)
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/site-bedrock.yml --check
#   ansible-playbook -i inventory/hosts.yml playbooks/site-bedrock.yml

- name: Provision Bedrock WordPress site (wiltsu.dev)
  hosts: all
  gather_facts: true
  vars_files:
    - ../inventory/group_vars/site_bedrock.yml

  pre_tasks:
    - name: DRAFT warning
      ansible.builtin.debug:
        msg: >-
          This playbook is a draft. Confirm server hardening before running.
          Use --check first. See docs/getting-started.md

    - name: Require site_bedrock variables file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../inventory/group_vars/site_bedrock.yml"
      register: bedrock_vars_file
      delegate_to: localhost
      become: false

    - name: Fail if site_bedrock.yml is missing
      ansible.builtin.fail:
        msg: "Copy ansible/inventory/group_vars/site_bedrock.example.yml to site_bedrock.yml and edit it."
      when: not bedrock_vars_file.stat.exists
      delegate_to: localhost
      become: false

  roles:
    - role: bedrock_site

  post_tasks:
    - name: Post-provision reminders
      ansible.builtin.debug:
        msg:
          - "1. Fill .env on server if not done (DB password, salts from https://roots.io/salts.html)"
          - "2. sudo certbot --nginx -d {{ bedrock_domain }}{% if bedrock_domain_aliases is defined %} -d {{ bedrock_domain_aliases | join(' -d ') }}{% endif %}"
          - "3. Wire mydevsite deploy.yml to reusable-deploy-bedrock.yml"
          - "4. First deploy: push to master, then wp core install or import DB"
