[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

# Output: multi-line messages as real lines, no "skipping:" noise, file path
# on failure, total run time at the end.
# Stock output for one run:
#   ANSIBLE_DISPLAY_SKIPPED_HOSTS=true ANSIBLE_CALLBACK_RESULT_FORMAT=json ansible-playbook ...
callback_result_format = yaml
display_skipped_hosts = False
show_task_path_on_failure = True
callbacks_enabled = ansible.posix.timer

[privilege_escalation]
become = True
become_method = sudo
