# Copy to all.yml and customize. all.yml is gitignored.

# SSH: users allowed to log in (space-separated in sshd_config)
platform_ssh_allowed_users:
  - deploy
  - utils-sync # GitHub Actions sync of linux-server-utils (see docs/linux-server-utils-sync.md)
  - deploy # GitHub Actions app deploys (see docs/deploy-user.md)

# Public key whose private half is the SSH_KEY secret on linux-server-utils.
# It can only run the sync command on the server.
# linux_server_utils_sync_ci_pubkey: "ssh-ed25519 AAAA... github-actions-utils-sync"

# UFW: allow HTTP/HTTPS for web servers
platform_ufw_allow_web: true

# UFW: restrict SSH to a single IP (optional — leave empty to allow OpenSSH globally)
# platform_ufw_ssh_from_ip: "203.0.113.50"

# fail2ban SSH jail
platform_fail2ban_sshd_maxretry: 3
platform_fail2ban_sshd_bantime: 1h
platform_fail2ban_sshd_findtime: 10m

# fail2ban nginx jails; see roles/fail2ban/defaults/main.yml
# for thresholds. Turn on per host in host_vars once nginx logs real IPs.
platform_fail2ban_nginx_enabled: false
# platform_fail2ban_ignoreip: ["203.0.113.10"]

# Bind MySQL to localhost when mysql role/package is present
platform_mysql_bind_localhost: true

# App deploys (docs/deploy-user.md). One key per app repo; the private half is
# that repo's SSH_KEY secret.
# deploy_user_keys:
#   - name: example-app
#     key: "ssh-ed25519 AAAA... deploy-example-app"
# deploy_user_site_paths:
#   - /var/www/example-app
