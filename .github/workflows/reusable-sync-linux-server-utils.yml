# Called from linux-server-utils sync-servers.yml (not run on push to this repo).
name: Reusable sync linux-server-utils

on:
  workflow_call:
    inputs:
      sync_label:
        description: Short id for Actions concurrency (per target host)
        required: true
        type: string
    secrets:
      SSH_KEY:
        required: true
      HOST:
        required: true
      USER:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-linux-server-utils-${{ inputs.sync_label }}
      cancel-in-progress: false

    steps:
      - name: Pull linux-server-utils on server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
        run: |
          set -euo pipefail

          if [[ -z "${SSH_KEY//[[:space:]]/}" ]]; then
            echo "Error: SSH_KEY secret is empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "Error: SSH_KEY is not a valid unencrypted private key."
            exit 1
          fi

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          REMOTE="${USER}@${HOST}"
          SSH_OPTS=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)

          # The server ignores any command sent here: this key is pinned to
          # the sync script by authorized_keys (see platform role
          # linux_server_utils and docs/linux-server-utils-sync.md).
          ssh -T "${SSH_OPTS[@]}" "$REMOTE"
